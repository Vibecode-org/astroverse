server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Сжатие статики и каталога: JSON /api/objects — около 1.7 МБ без gzip,
    # бинарный v2 (application/octet-stream) — 13 МБ на 100k, ~2.4 МБ по сети.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/octet-stream;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # No inline scripts are produced by the Vite build; inline styles are needed
    # by React's style attributes. Textures come from jsDelivr, everything else
    # must stay same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Docker embedded DNS. Без него имя backend резолвится один раз на старте,
    # и после пересоздания контейнера nginx отдаёт 502 до собственного рестарта.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Точный /api не попадает в location /api/ и ушёл бы в SPA с кодом 200.
    location = /api {
        return 404;
    }

    location /assets/ {
        # Vite добавляет хеш к именам файлов, поэтому их можно кэшировать навсегда.
        expires 1y;
        try_files $uri =404;
    }

    location /api/ {
        # Передаем запрос на бэкенд без перезаписи URI
        # Имя хоста в переменной резолвится на каждый запрос, а не один раз.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/live-ephemeris делает до девяти последовательных запросов к JPL
        # с таймаутом 10 с, поэтому дефолтных 60 с не хватает.
        proxy_read_timeout 120s;
    }

    location = /index.html {
        # index.html ссылается на хешированные ассеты: его нельзя кэшировать.
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
