name: Tests
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime from a context without catalog fixtures
        run: |
          runtime_context=$(mktemp -d)
          trap 'rm -rf "$runtime_context"' EXIT
          tar --exclude=.git --exclude=data/catalog_seed.json --exclude=data/objects.json -cf - . | tar -xf - -C "$runtime_context"
          docker build -f "$runtime_context/backend/Dockerfile" -t astroverse-backend:latest "$runtime_context"
          docker run --rm --entrypoint python astroverse-backend:latest -c 'from pathlib import Path; assert not Path("/app/data/catalog_seed.json").exists(); assert not Path("/app/data/objects.json").exists(); assert not Path("/app/tests").exists()'
      - name: Backend coverage and strict sector coverage
        run: make coverage
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
