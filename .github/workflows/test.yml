name: Tests
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend
      - name: Backend coverage and strict sector coverage
        run: |
          docker compose run --rm --no-deps -w /app backend sh -c '
            python -m pip install --target /tmp/coverage -r tests/requirements-coverage.txt &&
            PYTHONPATH=/tmp/coverage python -m coverage run --branch --source=backend,data -m unittest discover -s tests -t . &&
            PYTHONPATH=/tmp/coverage python -m coverage report --fail-under=95 &&
            PYTHONPATH=/tmp/coverage python -m coverage report --include=data/sectors.py --fail-under=100
          '
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
