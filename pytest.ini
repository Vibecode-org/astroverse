[pytest]
# Браузерные smoke-тесты намеренно названы smoke_*.py, чтобы unittest discover
# не импортировал их в backend-образе без pytest/playwright.
python_files = smoke_*.py
markers =
    stack3471: модуль рассчитан на обычный стек с 3471 объектом (conftest пропускает его на 100k)
    stack100k: модуль рассчитан на нагрузочный стек со 100 000 объектов (conftest пропускает его на 3471)
